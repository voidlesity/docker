# Tuwunel
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8448 ssl;
    listen [::]:8448 ssl;
    http2 on;
    server_name voidlesity.dev;

    ssl_certificate     /etc/letsencrypt/live/voidlesity.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidlesity.dev/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://localhost:8008/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}


# LiveKit & JWT Service
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtc.voidlesity.dev;

    ssl_certificate     /etc/letsencrypt/live/voidlesity.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidlesity.dev/privkey.pem;

    location ~ ^/(sfu/get|healthz|get_token) {
        proxy_pass http://localhost:8093;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:7880;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}


# Sable
server {
    listen 443 ssl;
    server_name chat.voidlesity.dev;

    ssl_certificate     /etc/letsencrypt/live/voidlesity.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidlesity.dev/privkey.pem;

    location / {
        proxy_pass http://localhost:8094/;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
