services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:latest
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - /home/misc/tuwunel:/var/lib/tuwunel
    env_file: ".env"
    labels:
      arcane.icon: matrix
  rtc-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    restart: unless-stopped
    env_file: "jwt.env"
    network_mode: "host"
    labels:
      arcane.icon: jwt.io
  rtc-livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    labels:
      arcane.icon: live-blog
  sable:
    image: ghcr.io/sableclient/sable:latest
    restart: unless-stopped
    ports:
      - "8094:8080"
    labels:
      arcane.icon: element
  bridge-discord:
    image: dock.mau.dev/mautrix/discord:latest
    restart: unless-stopped
    volumes:
      - /home/misc/mautrix/discord:/data
    labels:
      arcane.icon: discord
  bridge-signal:
    image: dock.mau.dev/mautrix/signal:latest
    restart: unless-stopped
    volumes:
      - /home/misc/mautrix/signal:/data
    labels:
      arcane.icon: signal
  bridge-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    restart: unless-stopped
    volumes:
      - /home/misc/mautrix/whatsapp:/data
    labels:
      arcane.icon: whatsapp