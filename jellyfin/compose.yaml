services:
  aria2:
    image: p3terx/aria2-pro
    volumes:
      - ./aria2:/config
      - ./data/downloads:/downloads
    env_file:
      .env
    ports:
      - 6800:6800
      - 6888:6888
      - 6888:6888/udp
    restart: unless-stopped
    labels:
      arcane.icon: aria2-light

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/config/custom-cont-init.d:/custom-cont-init.d
      - ./jellyfin/cache:/cache
      - ./data/media:/media
    labels:
      arcane.icon: jellyfin

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    ports:
      - 9696:9696
    volumes:
      - ./prowlarr/config:/config
    labels:
      arcane.icon: prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - 7878:7878
    volumes:
      - ./radarr/config:/config
      - ./data:/data
    labels:
      arcane.icon: radarr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - 8989:8989
    volumes:
      - ./sonarr/config:/config
      - ./data:/data
    labels:
      arcane.icon: sonarr

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    init: true
    ports:
      - 5055:5055
    volumes:
      - ./seerr/config:/app/config
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      arcane.icon: seerr