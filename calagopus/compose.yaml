services:
  web:
    image: ghcr.io/calagopus/panel:latest
    restart: unless-stopped
    env_file: ".env"
    volumes:
      # --- panel
      - /home/misc/gems/data:/var/lib/calagopus
      - /home/misc/gems/logs:/var/log/calagopus

      # --- wings
      - /home/misc/calagopus/wings-config.yml:/wings-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      - /etc/calagopus-wings/:/etc/calagopus-wings/
      - /var/lib/calagopus-wings/:/var/lib/calagopus-wings/
      - /var/log/calagopus-wings/:/var/log/calagopus-wings/
      - /tmp/calagopus-wings/:/tmp/calagopus-wings/
    ports:
      - 8000:8000
      - 2022:2022
    depends_on:
      - db
      - cache
    labels:
      arcane.icon: calagopus

  db:
    image: ghcr.io/calagopus/pgautoupgrade:18-alpine
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=panel
      - POSTGRES_PASSWORD=panel
      - POSTGRES_DB=panel
      - PGDATA=/data
    volumes:
      - ./postgres:/data
    labels:
      arcane.icon: postgresql

  cache:
    image: ghcr.io/calagopus/valkey:latest
    restart: unless-stopped
    command: --protected-mode no --save 60 1
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./cache:/data
    labels:
      arcane.icon: valkey-light